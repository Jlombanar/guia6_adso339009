<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <title>Flujo de Git: directorio de trabajo, área de preparación, repositorio local y repositorio remoto en GitHub</title>
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a24"/>
    </marker>
  </defs>
  <!-- zona local -->
  <rect x="12" y="20" width="600" height="250" rx="14" fill="#f4f7f4" stroke="#c9d3cc" stroke-dasharray="6 4"/>
  <text x="28" y="44" font-weight="700" fill="#2b7a00">TU COMPUTADOR · Git (local)</text>
  <!-- zona remota -->
  <rect x="636" y="20" width="232" height="250" rx="14" fill="#e3eef7" stroke="#0067ac" stroke-dasharray="6 4"/>
  <text x="652" y="44" font-weight="700" fill="#0067ac">INTERNET · GitHub (remoto)</text>
  <!-- cajas -->
  <g font-weight="700" text-anchor="middle">
    <rect x="30" y="90" width="160" height="80" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="2"/>
    <text x="110" y="124">Directorio</text>
    <text x="110" y="142">de trabajo</text>
    <rect x="230" y="90" width="160" height="80" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="2"/>
    <text x="310" y="124">Área de</text>
    <text x="310" y="142">preparación</text>
    <rect x="430" y="90" width="160" height="80" rx="10" fill="#e8f5e0" stroke="#2b7a00" stroke-width="2"/>
    <text x="510" y="124">Repositorio</text>
    <text x="510" y="142">local (.git)</text>
    <rect x="672" y="90" width="160" height="80" rx="10" fill="#fff" stroke="#0067ac" stroke-width="2"/>
    <text x="752" y="124">Repositorio</text>
    <text x="752" y="142">remoto</text>
  </g>
  <g font-weight="400" fill="#5c6a62" font-size="11" text-anchor="middle">
    <text x="110" y="160">archivos que editas</text>
    <text x="310" y="160">git status</text>
    <text x="510" y="160">historial de commits</text>
    <text x="752" y="160">github.com/usuario/repo</text>
  </g>
  <!-- flechas de ida -->
  <g stroke="#1f2a24" stroke-width="2" fill="none" marker-end="url(#f)">
    <line x1="190" y1="110" x2="228" y2="110"/>
    <line x1="390" y1="110" x2="428" y2="110"/>
    <line x1="590" y1="110" x2="670" y2="110"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">
    <text x="209" y="80" fill="#b84a00">add</text>
    <text x="409" y="80" fill="#b84a00">commit</text>
    <text x="630" y="80" fill="#b84a00">git push</text>
  </g>
  <!-- flechas de vuelta -->
  <g stroke="#0067ac" stroke-width="2" fill="none" marker-end="url(#f)">
    <path d="M752 172 C 752 225, 520 225, 512 174"/>
    <path d="M752 172 C 752 250, 120 250, 110 174"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#0067ac" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">
    <text x="700" y="236">git fetch</text>
    <text x="400" y="262">git pull / git clone</text>
  </g>
</svg>
